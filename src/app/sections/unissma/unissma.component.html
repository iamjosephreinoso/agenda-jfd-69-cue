<div class="wrapper">
    <section class="modern-hero">
        <div class="collage-container">
            <div class="pill-group">
                <div class="image-collage-mask"></div>
                <div class="pill decorative-pill blue-pill pos-1"></div>
                <div class="pill decorative-pill yellow-pill pos-2"></div>
                <div class="pill decorative-pill yellow-pill pos-6"></div>
                <div class="pill decorative-pill blue-pill pos-7"></div>
            </div>
        </div>

        <div class="hero-text-container">
            <div class="brand-header">
                <img src="assets/img/logoupscolor.png" alt="Logo UPS" class="hero-logo" />
            </div>

            <h1 class="main-title">
                ESPACIOS 100% LIBRES DE  <br>
                <span class="highlight">HUMO DE TABACO</span>
            </h1>

            <div class="top-tag">
                <span class="tag-text">UNISSMA</span>
                <span class="tag-divider">•</span>
                <span class="tag-text"> Sede Cuenca</span>
            </div>
        </div>
    </section>

    <div class="container_cro">
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item">
                <a class="nav-link"
                   [ngClass]="{ 'active': activeTab === 'tab1' }"
                   [routerLink]="['/unissma_lala']"
                   [queryParams]="{ tab: 'tab1' }">
                    Viernes, 25 de Septiembre
                </a>
            </li>
        </ul>

        <div class="tab-content mt-5">
            <div class="tab-pane" [ngClass]="{ 'show active': activeTab === 'tab1' }" *ngIf="activeTab === 'tab1'">
                <ul class="timeline">
                    <!-- 01: Momento de Oración -->
                    <li class="timeline-item color-1">
                        <div class="timeline-badge">01</div>
                        <div class="timeline-panel">
                            <div class="card-top-bar">
                                <span class="card-time-badge">
                                    <i class="fas fa-clock"></i> 10h00 - 11h00
                                </span>
                                <span class="card-tag">Charla</span>
                            </div>
                            <h4 class="card-title">Espacios 100% libres de Humo de Tabaco</h4>
                            <div class="card-meta">
                                <div class="meta-row location">
                                    <div class="meta-icon"><i class="fas fa-map-marker-alt"></i></div>
                                    <span>Teatro Carlos Crespi</span>
                                </div>
                                <div class="meta-row speaker">
                                    <div class="meta-icon"><i class="fas fa-user-tie"></i></div>
                                    <span>UNISSMA</span>
                                </div>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
