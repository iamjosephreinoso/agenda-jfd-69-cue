<div class="wrapper">
    <header class="slanted-header">
        <div class="header-background" style="background-image: url('assets/img/banner.avif');">
            <div class="header-overlay"></div>
        </div>
        <div class="header-content">
            <img src="assets/img/logoupsblanco.png" alt="Logo UPS" class="ups-logo-slanted" />
            <h1 class="slanted-title">INSCRIPCIONES TALLERES</h1>
        </div>
    </header>

        <main class="app-main container">
            <div class="form-card-container">
                <form [formGroup]="miFormulario" (ngSubmit)="enviarFormulario()" class="pill-form">
                    <h4 class="form-instruction">Complete sus datos institucionales</h4>

                    <div class="input-group-pill">
                        <label><i class="fas fa-id-card"></i> Cédula:</label>
                        <div class="search-input-wrapper" style="display: flex; gap: 10px;">
                            <input formControlName="cedula" type="text" maxlength="10" placeholder="Ej: 0102030405" style="flex: 1;">

                            <button type="button"
                                    (click)="buscarDocenteManualmente()"
                                    class="btn-search-docente"
                                    [disabled]="miFormulario.get('cedula').value?.length !== 10">
                                <i class="fas fa-search"></i> BUSCAR
                            </button>
                        </div>
                    </div>

                    <div class="input-group-pill">
                        <label><i class="fas fa-user"></i> Nombres y Apellidos Completos:</label>
                        <input formControlName="nombres"
                               type="text"
                               (input)="toUpperCase('nombres', $event)"
                               [placeholder]="'NOMBRES COMPLETOS'">
                    </div>

                    <div class="input-group-pill">
                        <label><i class="fas fa-envelope"></i> Correo Institucional:</label>
                        <input formControlName="correo"
                               type="email"
                               [placeholder]="'usuario@ups.edu.ec'">
                    </div>

                    <div class="input-group-pill select-pill">
                        <label>
                            <i class="fas fa-chalkboard-teacher"></i> Taller:
                        </label>
                        <div class="custom-select-wrapper">
                            <select formControlName="curso" class="pill-select">
                                <option value="" disabled selected>-- Seleccione un Taller --</option>
                                <option *ngFor="let c of cursos"
                                        [value]="c"
                                        [disabled]="(cuposPorGrupo[c] || 0) >= maxCupos">

                                        {{ (cuposPorGrupo[c] || 0) >= maxCupos ? '🔴' : '🟢' }}

                                        {{ c }}

                                    — [Cupos: {{ cuposPorGrupo[c] || 0 }} de {{ maxCupos }}]
                                </option>
                            </select>
                            <div class="select-arrow">
                                <i class="fas fa-chevron-down"></i>
                            </div>
                        </div>
                        <small *ngIf="cargandoCupos" class="animate-pulse" style="color: #003366; font-size: 0.75rem; margin-top: 5px; display: block;">
                            <i class="fas fa-sync fa-spin"></i> Verificando disponibilidad de cupos...
                        </small>
                    </div>

                    <div class="form-footer">
                        <button type="submit" class="btn-enviar-slanted" [disabled]="miFormulario.invalid || (cuposActuales[miFormulario.value.curso] >= maxCupos)">
                            <i class="fas fa-check-circle"></i> FINALIZAR INSCRIPCIÓN
                        </button>
                        <p class="nota-footer">
                            <i class="fas fa-info-circle" style="margin-right: 8px;"></i>
                            Para registrar su asistencia, es necesario ingresar al <strong>taller en el que se encuentra inscrito</strong>.
                        </p>
                    </div>
                </form>
            </div>
        </main>
</div>
